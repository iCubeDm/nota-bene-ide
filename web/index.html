<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nota Bene</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<script>
// Apply the cached theme before the first paint (shell/theme.ts does it again once loaded).
// Keep this list in step with THEMES in shared/src/lang.ts.
try { var ids = ['darcula', 'plannotator', 'solarized-dark', 'intellij-light', 'github-light', 'solarized-light'], t = localStorage.getItem('nb.theme'); if (ids.indexOf(t) >= 0) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
