name: nb_app
description: Nota Bene on the phone, a tab of a host's windows through the relay.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  nb_channel:
    path: ../channel
  nb_protocol:
    path: ../protocol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
