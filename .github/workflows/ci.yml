name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # the remote connector's tests run against the real relay (server/src/remote/testRelay.ts)
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y trash-cli
      - run: npm ci
      - run: npx tsc -b
      - run: npm test

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gen:protocol -- --check
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - run: dart pub get
        working-directory: mobile/protocol
      - run: dart analyze --fatal-infos
        working-directory: mobile/protocol
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: mobile/protocol
      - run: dart test
        working-directory: mobile/protocol
      - run: dart pub get
        working-directory: mobile/channel
      - run: dart analyze --fatal-infos
        working-directory: mobile/channel
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: mobile/channel
      - run: dart test
        working-directory: mobile/channel

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - run: test -z "$(gofmt -l .)"
        working-directory: relay
      - run: go vet ./...
        working-directory: relay
      - run: go test -race ./...
        working-directory: relay
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/nb-relay ./cmd/nb-relay
        working-directory: relay
      - run: docker build relay
