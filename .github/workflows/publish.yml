name: Publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm ci
      - name: Check the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$(node -p "require('./package.json').version")" ] || { echo "The tag does not match package.json"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "The tagged commit is not on main"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: node scripts/build-package.mjs --out "$RUNNER_TEMP/package"
      - name: Pack
        working-directory: ${{ runner.temp }}/package
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          echo "ARCHIVE=$RUNNER_TEMP/nota-bene-ide-$VERSION.tgz" >> "$GITHUB_ENV"
      - run: npm publish "$ARCHIVE" --access public --tag latest
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            printf 'Published to npm as `nota-bene-ide@%s`; this tag is the exact source of the archive.\n\n' "$VERSION"
            awk -v head="## $VERSION " 'index($0, head) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
